#
# Checks that this repository builds as part of Hearth Office: it builds the
# "web-apps" target of the Document Server image with this commit in place of
# the one the hearth-office repository pins. Nothing is published; the image
# itself is built by the "Hearth Office image" workflow in hearth-office.
#
# The component Dockerfiles expect the layout of the hearth-office
# repository (every component as a sibling folder), so that repository is
# checked out first and this one is placed inside it.

name: Hearth build

on:
  workflow_dispatch:
  push:
    branches: [hearth]
  pull_request:

permissions: {}

concurrency:
  group: hearth-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Check out hearth-office with its components
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/hearth-office
          ref: main
          submodules: recursive

      - name: Put this commit in place of the pinned web-apps
        uses: actions/checkout@v4
        with:
          path: web-apps
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # sdkjs needs core's WebAssembly modules; they come from the build the
      # "Hearth core" workflow published for the pinned core.
      - name: Build web-apps
        working-directory: build
        run: |
          set -euo pipefail
          prefix="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/hearth-office"
          tree=$(git -C ../core rev-parse 'HEAD^{tree}')
          export CORE_PREBUILT="docker-image://$prefix-core:$tree"
          export CORE_WASM_PREBUILT="docker-image://$prefix-core-wasm:$tree"
          export PRODUCT_VERSION="$(cat ../VERSION)"
          export CACHE_ROOT=/mnt/hearth-bake-cache
          sudo mkdir -p "$CACHE_ROOT" && sudo chown "$(id -u)" "$CACHE_ROOT"
          docker buildx bake --allow "fs=$CACHE_ROOT" --allow "fs.read=.." web-apps
